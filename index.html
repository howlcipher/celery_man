<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paul's Computer - Cinco OS</title>
    <meta property="og:title" content="Celery Man">
    <meta property="og:description" content="Cinco OS">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://howlcipher.github.io/celery_man/">
    <meta property="og:image" content="https://howlcipher.github.io/celery_man/images/cinco_celery_man.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Celery Man">
    <meta name="twitter:description" content="Cinco OS">
    <meta name="twitter:image" content="https://howlcipher.github.io/celery_man/images/cinco_celery_man.jpg">
    <link rel="icon" type="image/jpeg" href="images/favicon.jpg">
    <link rel="shortcut icon" type="image/jpeg" href="images/favicon.jpg">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <div class="desktop">
        <a href="https://github.com/howlcipher/celery_man" class="repo-link" target="_blank">
            <svg height="32" aria-hidden="true" viewBox="0 0 16 16" version="1.1" width="32" data-view-component="true" class="octicon octicon-mark-github v-align-middle">
                <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
            </svg>
            <span>View Source on GitHub</span>
        </a>
        
        <div class="window" id="cinco-window">
            <div class="window-titlebar" id="window-titlebar">
                <span>Cinco OS - Sequence Generator</span>
                <div class="window-controls">
                    <button class="win-btn minimize">_</button>
                    <button class="win-btn maximize">□</button>
                    <button class="win-btn close">×</button>
                </div>
            </div>
            <div class="window-content">
                <div class="cinco-logo-container" style="text-align: center; margin-bottom: 10px; background: #000; padding: 5px; border: 2px inset var(--win-border-dark);">
                    <img src="images/cinco_celery_man.jpg" alt="Cinco" style="max-width: 100%; height: auto; max-height: 150px; object-fit: contain;">
                </div>
                <div class="display-container">
                    <div id="display-area" class="display-area">
                        <img id="placeholder-image" src="images/celery_man.jpg" alt="Cinco Identity Generator 2.5" class="placeholder-img" style="filter: grayscale(100%) opacity(0.3);">
                        <img id="sequence-image" src="" alt="Sequence" style="display: none;">
                        <div id="printout" class="printout" style="display: none;">
                            <img src="images/oyster.jpg" alt="Oyster">
                        </div>
                    </div>
                </div>
                
                <div class="controls-panel">
                    <div class="control-group">
                        <div class="group-label">SEQUENCES</div>
                        <button data-command="celery_man" class="btn">Celery Man</button>
                        <button data-command="oyster" class="btn">Oyster</button>
                        <button data-command="tayne" class="btn">Tayne</button>
                    </div>
                    
                    <div class="control-group">
                        <div class="group-label">MODIFIERS</div>
                        <button data-command="4d3d3d3" class="btn">4d3d3d3</button>
                        <button data-command="hat_wobble" class="btn">Hat Wobble</button>
                        <button data-command="flarhgunnstow" class="btn">Flarhgunnstow</button>
                    </div>
                    
                    <div class="control-group">
                        <div class="group-label">ACTIONS</div>
                        <button data-command="print" class="btn">Printout</button>
                        <button data-command="nude_tayne" class="btn alert-btn">Nude Tayne</button>
                    </div>
                </div>

                <div class="terminal-panel">
                    <div class="output-log" id="output-log">
                        <p>Cinco OS Version 1.0 initialized.</p>
                    </div>
                    <div class="input-row">
                        <span>&gt;</span>
                        <input type="text" id="cli-input" placeholder="Enter command or use buttons..." autocomplete="off">
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Nude Tayne Warning Overlay -->
        <div id="nude-tayne-warning" class="warning-overlay" style="display: none;">
            <div class="warning-content">
                <img src="images/nude_tayne.jpg" alt="Not Computing">
                <h1 class="strobe-text">NOT COMPUTING. PLEASE COMPUTE.</h1>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
