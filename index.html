<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinco OS - Celery Man</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <div class="crt-overlay"></div>
    <div class="container">
        <div class="monitor">
            <div class="screen">
                <div class="content-area">
                    <img id="display-image" src="" alt="" style="display: none;">
                    <div id="text-display" class="text-display">
                        <p>CINCO OS v1.0.3</p>
                        <p>INITIALIZING...</p>
                        <p>READY.</p>
                    </div>
                </div>
                <div class="terminal">
                    <div class="output" id="output"></div>
                    <div class="input-line">
                        <span class="prompt">&gt;</span>
                        <input type="text" id="command-input" autocomplete="off" autofocus>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="controls-hint">
            <h3>Try typing these commands:</h3>
            <ul>
                <li><code>load up celery man please</code></li>
                <li><code>can i get a printout of oyster smiling</code></li>
                <li><code>could you kick up the 4d3d3d3</code></li>
                <li><code>let's look at tayne</code></li>
                <li><code>can i see a nude tayne</code></li>
            </ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
